<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test AMEV — pubblicazione statica</title>
</head>
<body>
  <h1>Test AMEV — pubblicazione statica</h1>
  <pre id="results">Running…</pre>
  <iframe id="wrapper" title="Wrapper AMEV sotto test" src="./verifica-prima%20di%20pagare/index.html" width="1000" height="700"></iframe>
  <iframe id="direct" title="Guida AMEV sotto test" src="./verifica-prima%20di%20pagare/amevcheck/index.html" width="1000" height="700"></iframe>
  <iframe id="report" title="Rapporto AMEV sotto test" src="./verifica-prima%20di%20pagare/amevcheck/rapporto.html" width="1000" height="700"></iframe>
  <script>
    const results = document.getElementById('results');
    const checks = [];
    function check(condition, message) {
      checks.push(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
      results.textContent = checks.join('\n');
      if (!condition) throw new Error(message);
    }
    async function waitFor(predicate) {
      const deadline = Date.now() + 20000;
      while (Date.now() < deadline) {
        if (predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      throw new Error('Timed out waiting for page readiness');
    }
    async function runRegisterTests(wrapper) {
      const doc = wrapper.contentDocument;
      const win = wrapper.contentWindow;
      const base = new URL('./verifica-prima%20di%20pagare/', location.href);
      const served = new DOMParser().parseFromString(
        await (await fetch(new URL('index.html', base))).text(), 'text/html');
      const staticSlots = [...served.querySelectorAll('#registro-data .cycle-grid > li .slot-label')];
      check(staticSlots.length === 20 && staticSlots.every((slot, i) => slot.textContent.endsWith(`${i + 1}/20`)),
        'Initially served HTML contains the 20 cycle slots 1/20…20/20');
      check(served.querySelector('#registro-data .empty-state')?.textContent === 'Nessuna verifica documentata'
        && !served.querySelector('#registro-data').textContent.includes('✓'),
        'Served HTML shows the empty state without invented checks');
      const heading = doc.getElementById('registro-title');
      check(heading?.tagName === 'H2'
        && heading.textContent === 'Registro verifiche di coerenza home page Authority',
        'Register section keeps the requested heading');
      const navLink = doc.querySelector('header nav a[href="#registro-verifiche"]');
      check(navLink && doc.getElementById('registro-verifiche').contains(heading),
        'Header navigation anchors the register section');
      const section = doc.getElementById('registro-verifiche');
      for (const attribute of ['data-register-src', 'data-dataset-src']) {
        const target = new URL(section.getAttribute(attribute), doc.baseURI);
        check(target.pathname.startsWith(new URL('./', location.href).pathname) && (await fetch(target)).ok,
          `${attribute} resolves relative to the published path`);
      }
      const template = await (await fetch(new URL('registro-verifiche-template.csv', base))).text();
      check(template.trim() === 'authorityId,cycleId,cycleStartDate,cycleDay,reviewedAt,status,checkedUrl,finalUrl,reviewedBy,notes,evidenceRef',
        'Downloadable CSV template is empty apart from the documented header');
      const methodText = doc.querySelector('.register-method').textContent;
      check(methodText.includes('Non significa') && methodText.includes('Europe/Rome')
        && methodText.includes('meno di 20 giorni') && methodText.includes('non è una certificazione indipendente'),
        'Methodology, limits, timezone and 20-day validity are documented on the page');

      await waitFor(() => win.AmevRegister);
      await win.AmevRegister.ready;
      const dataset = await (await fetch(new URL('../financial_authorities_database.json', base))).json();
      const total = Object.keys(dataset).length;
      const live = doc.getElementById('registro-data');
      const liveSlots = [...live.querySelectorAll('.cycle-grid button.cycle-slot')];
      check(liveSlots.length === 20
        && liveSlots.every((slot, i) => slot.querySelector('.slot-label').textContent === `Giorno ${i + 1}/20`
          && slot.textContent.includes('Data non assegnata') && slot.disabled),
        'Interactive grid has 20 labelled cycle-day buttons without invented dates');
      check(live.querySelector('.empty-state')?.textContent === 'Nessuna verifica documentata'
        && live.querySelector('.authority-overview .state-undocumented').textContent.endsWith(String(total))
        && live.querySelector('.authority-overview .state-verified').textContent.endsWith(': 0')
        && live.textContent.includes(`Da verificare o rinnovare: ${total} su ${total}`),
        `Empty register exposes the real dataset backlog (${total} Authority)`);

      const R = win.AmevRegister;
      const ids = Object.values(dataset).map(r => r.financial_authority)
        .filter(fa => R.normalizeUrl(fa.homepage)).slice(0, 14);
      const at = (day, minute) => `2026-10-0${day}T10:${String(minute).padStart(2, '0')}:00+02:00`;
      const review = (fa, day, minute, extra) => Object.assign({
        authorityId: fa.authorityId, cycleId: '2026-C01', cycleDay: day, reviewedAt: at(day, minute),
        status: 'verified', checkedUrl: fa.homepage, finalUrl: fa.homepage, reviewedBy: 'Revisore AMEV',
        notes: '', evidenceRef: ''
      }, extra || {});
      const reviews = ids.slice(0, 12).map((fa, i) => review(fa, 1, i));
      reviews.push(review(ids[0], 1, 30));
      reviews.push(review(ids[12], 2, 0, { checkedUrl: 'https://mismatch.example.org/' }));
      reviews.push(review(ids[1], 3, 0, { status: 'blocked', finalUrl: '',
        notes: '<img src=x onerror="window.__xss=1">', evidenceRef: 'javascript:window.__xss=1' }));
      reviews.push(review(ids[2], 3, 5, { evidenceRef: 'https://web.archive.org/web/2026/x', reviewedBy: '<b>X</b>' }));
      reviews.push(review(ids[13], 5, 0, { reviewedAt: at(4, 0) }));
      const fixture = { cycles: [{ cycleId: '2026-C01', startDate: '2026-10-01' }], reviews,
        lastRecordedReviewAt: at(3, 5) };
      const box = doc.createElement('div');
      doc.body.appendChild(box);
      let now = Date.parse('2026-10-05T12:00:00+02:00');
      const ctl = R.render(box, fixture, dataset, { now: () => now });
      const slots = [...box.querySelectorAll('button.cycle-slot')];
      check(slots.length === 20 && slots[0].textContent.includes('1 ott 2026')
        && slots[19].textContent.includes('20 ott 2026'),
        'Explicit cycle start date maps 1/20…20/20 to real calendar dates');
      check(slots[0].classList.contains('slot-completed') && slots[0].textContent.includes('12/12 controlli')
        && slots[0].textContent.includes('Completato'),
        'Day with 12 distinct Authority (one re-check not double counted) is completed');
      check(slots[1].textContent.includes('Parziale') && slots[1].textContent.includes('1/12'),
        'Day with fewer than 12 checks is partial');
      check(slots[2].classList.contains('slot-problematic') && slots[2].textContent.includes('Con criticità'),
        'Day with a failed attempt is problematic, with a text state');
      check(slots[3].textContent.includes('Nessuna verifica documentata')
        && box.querySelector('.register-error').textContent.startsWith('1 record'),
        'Record with cycle day inconsistent with its timestamp is rejected and reported');
      check(!box.querySelector('img') && !win.__xss
        && [...box.querySelectorAll('a')].every(a => /^https?:$/.test(a.protocol)
          && a.rel.includes('noopener') && a.rel.includes('noreferrer'))
        && box.textContent.includes('javascript:window.__xss=1') && box.textContent.includes('<b>X</b>'),
        'Imported text is inert and only http(s) links are created, with safe rel');
      const stateOf = id => [...box.querySelectorAll('tbody tr')]
        .find(tr => tr.querySelector('code').textContent === id).lastElementChild;
      check(stateOf(ids[3].authorityId).className.includes('state-verified')
        && stateOf(ids[3].authorityId).textContent.includes('✓ Verificata'),
        'Recent positive check with matching URL shows the green tick');
      check(stateOf(ids[1].authorityId).className.includes('state-warning')
        && stateOf(ids[1].authorityId).textContent.includes('Ultima verifica positiva storica'),
        'Later blocked attempt replaces green with a warning and keeps history');
      check(stateOf(ids[12].authorityId).textContent.includes('non coincide'),
        'Checked URL different from the dataset homepage is never green');
      check(box.querySelectorAll('.authority-overview .state-verified').length === 1
        && box.textContent.includes(`Da verificare o rinnovare: ${total - 11} su ${total}`),
        'Coverage counts distinct Authority only');
      now = Date.parse(at(1, 3)) + 20 * 86400000 - 1000;
      ctl.refresh();
      check(stateOf(ids[3].authorityId).className.includes('state-verified'), 'Still valid one second before 20 days');
      now += 1000;
      ctl.refresh();
      check(stateOf(ids[3].authorityId).className.includes('state-renewal')
        && stateOf(ids[3].authorityId).textContent.includes('Da rinnovare'),
        'Green expires at exactly 20 days without a new commit');
      slots[0].focus();
      check(doc.activeElement === slots[0] && slots[0].type === 'button', 'Cycle slots are keyboard-focusable buttons');
      slots[0].click();
      check(slots[0].getAttribute('aria-pressed') === 'true' && box.querySelectorAll('tbody tr').length === 13
        && box.textContent.includes('Filtro attivo: giorno 1/20'), 'Selecting a slot filters its records');
      slots[3].click();
      check(box.querySelector('.empty-state').textContent.includes('per questo giorno del ciclo'),
        'Empty day shows a useful empty state');
      const clear = [...box.querySelectorAll('button')].find(b => b.textContent === 'Mostra tutte le verifiche');
      clear.click();
      check(clear.hidden && box.querySelectorAll('tbody tr').length === 16
        && slots.every(slot => slot.getAttribute('aria-pressed') === 'false'), 'Filter can be cleared');
      box.remove();

      const original = section.getAttribute('data-register-src');
      section.setAttribute('data-register-src', './file-inesistente.json');
      const originalError = win.console.error;
      win.console.error = () => {};
      await R.load();
      win.console.error = originalError;
      check(doc.getElementById('registro-load-status').textContent.includes('Impossibile caricare')
        && doc.querySelector('#registro-data .cycle-grid'), 'Loading errors are explained and published data stays');
      section.setAttribute('data-register-src', original);
      doc.getElementById('registro-load-status').classList.remove('register-error');
      await R.load();
    }
    async function run() {
      const wrapper = document.getElementById('wrapper');
      const direct = document.getElementById('direct');
      const report = document.getElementById('report');
      const homepageResponse = await fetch('./index.html');
      check(homepageResponse.ok, 'Homepage resolves');
      const homepage = new DOMParser().parseFromString(await homepageResponse.text(), 'text/html');
      const guideLink = homepage.querySelector('#table-of-contents a[href="./verifica-prima%20di%20pagare/index.html"]');
      check(guideLink?.textContent.includes('Verifica prima di pagare')
        && guideLink.previousElementSibling.getAttribute('href') === '#database-search-section'
        && guideLink.querySelector('[data-i18n-text="quickIndexVerifyLink"]'),
        'Localized guide button follows Search Authorities in the Quick Index');
      check((await fetch(guideLink.getAttribute('href'))).ok, 'Homepage guide button target resolves');
      await waitFor(() => wrapper.contentDocument.querySelector('.orbital-frame')
        && direct.contentDocument.querySelector('.step-tab')
        && report.contentDocument.querySelector('.report-sources li'));
      const embedded = wrapper.contentDocument.querySelector('.orbital-frame');
      await waitFor(() => embedded.contentDocument.querySelector('.step-tab'));
      check(embedded.getAttribute('src') === './amevcheck/index.html'
        && embedded.title.length > 0, 'Wrapper embeds a relative, accessibly titled frontend');
      const translationNote = wrapper.contentDocument.querySelector('.translation-note');
      check(translationNote?.textContent.includes('se disponibile')
        && translationNote.textContent.includes('smartphone')
        && translationNote.textContent.includes('imprecisioni'),
        'Visible translation note covers browser availability, mobile and limitations');
      const open = wrapper.contentDocument.querySelector('a[target="_blank"]');
      check(open.href === direct.src && open.rel.includes('noopener')
        && open.rel.includes('noreferrer'), 'Direct link opens the same frontend safely');
      await runRegisterTests(wrapper);
      for (const frame of [direct, report, embedded]) {
        const doc = frame.contentDocument;
        check(doc.documentElement.lang === 'it'
          && doc.querySelector('meta[name="viewport"]'), 'Italian page and mobile viewport');
        const script = doc.querySelector('script[type="module"]');
        const css = doc.querySelector('link[rel="stylesheet"][href^="./assets/"]');
        check(script?.getAttribute('src').startsWith('./assets/') && css,
          'Compiled JS and CSS use relative asset paths');
        check(!doc.querySelector('[src*="__manus__"], [src*="/manus-storage/"]'),
          'No debug collector or unavailable storage images');
        const images = [...doc.querySelectorAll('img')];
        await waitFor(() => images.every(image => image.complete && image.naturalWidth > 0));
        check(images.length === (frame === report ? 1 : 2)
          && images.every(image => image.getAttribute('src').startsWith('./images/')),
          'Provided PNG illustrations load from relative local paths');
        check(images.every(image => image.getAttribute('alt') !== null),
          'Illustrations retain descriptive or decorative alt attributes');
        check(!doc.querySelector('.art-unavailable'),
          'Missing-image notices have been removed');
        const localLinks = [...doc.querySelectorAll('a[href]')].filter(link =>
          link.origin === location.origin);
        const base = new URL('./verifica-prima%20di%20pagare/amevcheck/', location.href).pathname;
        check(localLinks.every(link => link.pathname.startsWith(base)),
          'Frontend navigation remains in the AMEV subfolder');
        for (const resource of [script.src, css.href, ...images.map(image => image.src),
          ...new Set(localLinks.map(link => link.href.split('#')[0]))]) {
          check((await fetch(resource)).ok, `Static resource resolves: ${new URL(resource).pathname}`);
        }
      }
      check(report.contentDocument.querySelectorAll('.report-section').length > 5,
        'Full report and its references render without a backend');
      const reportDoc = report.contentDocument;
      check(reportDoc.querySelectorAll('.report-sources li').length === 31,
        'All original source references are preserved');
      check(reportDoc.querySelector('.report-article').textContent.includes('elementi di affidabilità')
        && reportDoc.querySelector('.report-meta').textContent.includes('5 ottobre 2026'),
        'Report explains current reliability criteria and dates the editorial revision');
      check(reportDoc.querySelector('.report-article').textContent.includes('Non viene dichiarata alcuna approvazione')
        && reportDoc.querySelector('.report-article').textContent.includes('non certifica il pagamento'),
        'Report excludes AI endorsements and financial certification');
      check(!reportDoc.querySelector('.report-article').textContent.includes('criticità da correggere prima')
        && !direct.contentDocument.querySelector('.editorial-copy').textContent.includes('cose da correggere'),
        'Guide and report no longer present historical findings as outstanding defects');
      const paymentAnchor = direct.contentDocument.querySelector('.payment-card a[href*="#"]').hash;
      check(reportDoc.querySelector(paymentAnchor), 'Existing payment deep link still targets a report section');
      const guide = direct.contentDocument;
      for (let step = 1; step <= 4; step++) {
        check(guide.querySelector('.step-kicker').textContent.includes(`0${step}`),
          `Checklist step ${step} is active`);
        guide.querySelector('.step-actions button').click();
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      check(guide.querySelector('.checklist-finish').textContent.includes('Non è una certificazione'),
        'Checklist completes with the original non-certification disclaimer');
      guide.querySelector('.checklist-finish button').click();
      await waitFor(() => !guide.querySelector('.checklist-finish'));
      check(guide.querySelector('.step-kicker').textContent.includes('01'), 'Checklist resets');
      for (const width of [1000, 375]) {
        for (const frame of [wrapper, direct, report]) frame.width = width;
        await new Promise(resolve => setTimeout(resolve, 100));
        for (const frame of [wrapper, direct, report, embedded]) {
          check(frame.contentDocument.documentElement.scrollWidth <= frame.contentWindow.innerWidth,
            `No horizontal overflow at ${width}px`);
        }
        const firstScreen = wrapper.contentDocument.querySelector('.guide-viewport');
        const registerSection = wrapper.contentDocument.getElementById('registro-verifiche');
        check(embedded.getBoundingClientRect().height > 400
          && firstScreen.getBoundingClientRect().height <= wrapper.contentWindow.innerHeight
          && registerSection.getBoundingClientRect().top >= firstScreen.getBoundingClientRect().bottom,
          `Guide keeps the first screen and the register follows by scrolling at ${width}px`);
      }
      const toggle = guide.querySelector('.mobile-menu-toggle');
      toggle.click();
      await waitFor(() => guide.querySelector('#mobile-menu'));
      check(toggle.getAttribute('aria-expanded') === 'true', 'Accessible mobile menu opens');
      guide.querySelector('#mobile-menu a').click();
      await waitFor(() => !guide.querySelector('#mobile-menu'));
      check(toggle.getAttribute('aria-expanded') === 'false', 'Mobile navigation closes the menu');
      results.textContent += '\nDONE';
    }
    run().catch(error => {
      results.textContent += `\nFAIL: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
