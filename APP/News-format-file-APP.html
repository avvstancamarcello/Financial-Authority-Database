<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">News by Authorities - Financial Authority Database</title>
<meta name="description" content="Aggiornamenti in tempo reale, avvisi e comunicati ufficiali pubblicati dalle Autorità di Vigilanza Finanziaria nel Mondo.">
<style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .lang-switch { margin-bottom: 15px; }
        .lang-btn { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 0 4px; }
        .lang-btn.active { background: #008C45; }
        h1 { color: #008C45; font-size: 26px; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; font-size: 14px; }
        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .news-card { background: #1e293b; border-left: 4px solid #008C45; border-radius: 8px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .news-date { font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }
        .news-auth { display: inline-block; background: #334155; color: #e2e8f0; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
        .news-title { font-size: 18px; font-weight: bold; color: #f8fafc; text-decoration: none; display: block; margin-bottom: 8px; }
        .news-title:hover { color: #38bdf8; }
        .news-desc { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; }
        .news-link { color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: bold; }
        .news-link:hover { text-decoration: underline; }
        .back-btn { display: inline-block; margin-top: 30px; background: #008C45; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .back-btn:hover { background: #007038; }
        footer { text-align: center; margin-top: 40px; font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; }</style>
<div class="container">
  <header><!-- Selettore Lingua Istantaneo IT / EN -->
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLanguage('it')">🇮🇹 IT</button>
      <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
    </div>
    <h1 id="mainTitle">📰 News by Authorities</h1>
    <p class="subtitle" id="mainSubtitle">Aggiornamenti ufficiali e alert dalle Autorità di Vigilanza Finanziaria nel Mondo</p>
  </header>
        <!-- Barra di ricerca rapida -->
  <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cerca per data o autorità (es. CVM, FCA)..." onkeyup="filterNews()">
  <div id="newsContainer"></div>

  <div style="text-align: center;">
    <a href="https://www.amevfirenze.it" class="back-btn" id="backBtn">⬅️ Ritorna a Financial Authority Database</a>
  </div>
  <footer>
    <p id="footerText">Financial Authority Database · Webmaster &amp; Autore: Avvocato Marcello Stanca (Verificato)</p>
  </footer>
</div>
<script>
let currentLang = 'it';
let allNews = [];

function formatDate(isoDate, lang) {
  if (!isoDate) return '';
  const d = new Date(isoDate);
  if (isNaN(d)) return isoDate;
  return d.toLocaleDateString(lang === 'it' ? 'it-IT' : 'en-GB');
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function getLocalized(item, fieldBase, lang) {
  // supporta sia campi flat (_it/_en/_me) sia nested
  if (item[fieldBase + '_' + lang]) return item[fieldBase + '_' + lang];
  if (item[fieldBase] && typeof item[fieldBase] === 'object') {
    return item[fieldBase][lang] || item[fieldBase].it || item[fieldBase].en || '';
  }
  return item[fieldBase] || '';
}

function buildCard(item) {
  const title = getLocalized(item, 'title', currentLang);
  const summary = getLocalized(item, 'summary', currentLang) || getLocalized(item, 'body_text', currentLang);
  const cta = currentLang === 'it' ? 'Leggi comunicato ufficiale ➔' : 'Read official press release ➔';
  const dateIso = item.date || item.published_at || '';
  const dateLabel = formatDate(dateIso, currentLang);
  const authority = item.authority || item.source_authority || '';
  const country = item.country || '';
  const sourceUrl = item.source_url || item.url || '#';

  const searchable = `${title} ${summary} ${authority} ${country} ${dateLabel} ${dateIso}`.toLowerCase();

  return `
    <div class="news-card" data-text="${escapeHtml(searchable)}" data-date="${escapeHtml((dateIso || '').toLowerCase())}">
      <div class="news-date">📅 ${escapeHtml(dateLabel || dateIso)}</div>
      <div class="news-auth">${escapeHtml([country, authority].filter(Boolean).join(' · '))}</div>
      <a href="${escapeHtml(sourceUrl)}" target="_blank" class="news-title">${escapeHtml(title)}</a>
      <div class="news-desc">${escapeHtml(summary)}</div>
      <a href="${escapeHtml(sourceUrl)}" target="_blank" class="news-link">${cta}</a>
    </div>
  `;
}

function renderNews() {
  const container = document.getElementById('newsContainer');
  container.innerHTML = allNews.map(buildCard).join('');
  filterNews();
}

function setLanguage(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));

  if (lang === 'it') {
    document.querySelector('button[onclick="setLanguage(\'it\')"]').classList.add('active');
    document.getElementById('mainTitle').innerText = "📰 News by Authorities";
    document.getElementById('mainSubtitle').innerText = "Aggiornamenti ufficiali e alert dalle Autorità di Vigilanza Finanziaria nel Mondo";
    document.getElementById('searchInput').placeholder = "🔍 Cerca per data o autorità (es. CVM, FCA)...";
    document.getElementById('backBtn').innerText = "⬅️ Ritorna a Financial Authority Database";
    document.getElementById('footerText').innerText = "Financial Authority Database · Webmaster & Autore: Avvocato Marcello Stanca (Verificato)";
  } else {
    document.querySelector('button[onclick="setLanguage(\'en\')"]').classList.add('active');
    document.getElementById('mainTitle').innerText = "📰 News by Authorities";
    document.getElementById('mainSubtitle').innerText = "Official updates and alerts from Financial Supervisory Authorities worldwide";
    document.getElementById('searchInput').placeholder = "🔍 Search by date or authority (e.g. CVM, FCA)...";
    document.getElementById('backBtn').innerText = "⬅️ Return to Financial Authority Database";
    document.getElementById('footerText').innerText = "Financial Authority Database · Webmaster & Author: Marcello Stanca, Esq. (Verified)";
  }

  renderNews();
}

function filterNews() {
  const input = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.getElementsByClassName('news-card');
  for (let i = 0; i < cards.length; i++) {
    const text = (cards[i].getAttribute('data-text') || '').toLowerCase();
    const date = (cards[i].getAttribute('data-date') || '').toLowerCase();
    cards[i].style.display = (text.includes(input) || date.includes(input)) ? "" : "none";
  }
}

async function loadNews() {
  try {
    const res = await fetch('../NEWS/news-feed.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('Feed HTTP ' + res.status);
    const data = await res.json();

    // accetta sia array diretto sia {items:[...]}
    allNews = Array.isArray(data) ? data : (data.items || []);

    // ordina per data desc
    allNews.sort((a, b) => (b.date || b.published_at || '').localeCompare(a.date || a.published_at || ''));

    renderNews();
  } catch (err) {
    const container = document.getElementById('newsContainer');
    container.innerHTML = '<div class="news-card"><div class="news-desc">Unable to load news feed.</div></div>';
    console.error(err);
  }
}

loadNews();
</script>
