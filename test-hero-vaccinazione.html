<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regressione collegamento NAV vaccinazione.it</title>
</head>
<body>
    <h1>Hero NAV — collegamento volontario a vaccinazione.it</h1>
    <p>Servire la root via HTTP. Fixture isolata senza JavaScript della homepage, analytics o service worker.</p>
    <pre id="results">Running…</pre>
    <div id="fixtures"></div>
    <script>
        const results = document.getElementById('results'), checks = [];
        function check(condition, message) {
            checks.push(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
            results.textContent = checks.join('\n');
            if (!condition) throw new Error(message);
        }
        async function run() {
            const html = await (await fetch('./index.html')).text();
            const source = new DOMParser().parseFromString(html, 'text/html');
            const links = source.querySelectorAll('a.hero-vaccinazione-link');
            check(links.length === 1, 'una sola card NAV');
            const link = links[0], image = link.querySelector('img');
            check(!!link.closest('header[role="banner"]'), 'collegamento nella hero');
            check(link.getAttribute('href') === 'https://www.vaccinazione.it/', 'destinazione HTTPS esatta');
            check(!link.hasAttribute('target') && !link.hasAttribute('onclick') && !link.hasAttribute('role'),
                'anchor nativa nella stessa scheda, senza handler o ruolo sostitutivo');
            check(!link.closest('[aria-hidden="true"], [hidden], [inert]'), 'link fuori dai contenitori decorativi/nascosti');
            check(link.lang === 'it' && !link.querySelector('[data-i18n], [data-i18n-text]'),
                'fallback italiano esplicito senza chiavi di traduzione mancanti');
            check(['NAV', 'Cerchi www.vaccinazione.it?', 'AMEV Firenze', 'Vai al sito']
                .every(text => link.textContent.includes(text)), 'nome accessibile e destinazione leggibili senza immagine');
            check(image.getAttribute('src') === 'vaccinazione-amev-compress.png' && image.alt === '',
                'asset originale riutilizzato, senza testo alternativo ridondante');
            check(image.getAttribute('width') === '2012' && image.getAttribute('height') === '457',
                'dimensioni intrinseche dichiarate per riservare spazio');
            const asset = await fetch(image.getAttribute('src'));
            check(asset.ok, 'asset presente');
            const png = new DataView(await asset.arrayBuffer());
            check(png.getUint32(16) === 2012 && png.getUint32(20) === 457, 'dimensioni reali PNG 2012 × 457');

            const styles = [...source.querySelectorAll('head style')].map(style => style.outerHTML).join('');
            for (const width of [320, 375, 768, 1280]) {
                const frame = document.createElement('iframe');
                frame.style.cssText = `width:${width}px;height:600px;border:0;display:block`;
                const loaded = new Promise(resolve => frame.onload = resolve);
                frame.src = 'about:blank';
                document.getElementById('fixtures').appendChild(frame);
                await loaded;
                const doc = frame.contentDocument;
                doc.open();
                doc.write(`<!DOCTYPE html><html><head>${styles}</head><body><div class="container"><header role="banner">${link.outerHTML}</header></div></body></html>`);
                doc.close();
                const card = doc.querySelector('a'), img = card.querySelector('img');
                await img.decode();
                const box = card.getBoundingClientRect(), imageBox = img.getBoundingClientRect();
                check(box.width >= 44 && box.height >= 44, `${width}px: area touch ≥ 44px`);
                check(box.left >= 0 && box.right <= width && doc.documentElement.scrollWidth <= width,
                    `${width}px: nessun overflow orizzontale`);
                check(imageBox.width <= 320 && Math.abs(imageBox.width / imageBox.height - 2012 / 457) < 0.01
                    && frame.contentWindow.getComputedStyle(img).objectFit === 'contain',
                    `${width}px: immagine intera, proporzionata e limitata a 320px`);
                card.focus();
                check(doc.activeElement === card, `${width}px: link raggiungibile da tastiera senza JavaScript homepage`);
                const focusStyle = frame.contentWindow.getComputedStyle(card);
                check(card.matches(':focus-visible') && focusStyle.outlineStyle === 'solid' && focusStyle.outlineWidth === '3px',
                    `${width}px: focus visibile con contorno di 3px`);
                img.remove();
                check(card.textContent.includes('www.vaccinazione.it') && card.getBoundingClientRect().height >= 44,
                    `${width}px: testo utile e touch target preservati senza immagine`);
            }
            document.body.dataset.testStatus = 'passed';
            checks.push('ALL CHECKS PASSED');
            results.textContent = checks.join('\n');
        }
        run().catch(error => {
            document.body.dataset.testStatus = 'failed';
            checks.push(`ERROR: ${error.message}`);
            results.textContent = checks.join('\n');
        });
    </script>
</body>
</html>
