<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test authority — JSON-LD</title>
</head>
<body>
  <h1>Test authority — JSON-LD</h1>
  <pre id="results">Running…</pre>
  <script>
    const results = document.getElementById('results');
    const checks = [];
    function check(condition, message) {
      checks.push(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
      results.textContent = checks.join('\n');
      if (!condition) throw new Error(message);
    }
    async function run() {
      const response = await fetch('./index.html');
      check(response.ok, 'Homepage resolves');
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const root = 'https://amevfirenze.it/';
      check(page.querySelector('link[rel="canonical"]').href === root, 'Canonical retains the non-www domain');
      const authorities = [
        ['CONSOB', 'IT-CONSOB'],
        ['FCA', 'UK-FCA'],
        ['CNMV', 'ES-CNMV'],
        ['AMF', 'FR-AMF'],
        ['BaFin', 'DE-BAFIN'],
        ['SEC', 'US-SEC']
      ];
      for (const [id, type, field] of [
        ['website-jsonld', 'WebSite', 'hasPart'],
        ['dataset-jsonld', 'Dataset', 'subjectOf']
      ]) {
        const scripts = page.querySelectorAll(`script#${id}[type="application/ld+json"]`);
        check(scripts.length === 1, `${id} exists exactly once`);
        const data = JSON.parse(scripts[0].textContent);
        check(data['@type'] === type && data.url === root, `${id} retains its type and domain`);
        const expected = authorities.map(([name, path]) => ({
          '@type': 'WebPage',
          name: `${name} Orbital Web App`,
          url: `${root}authority/${path}.html`
        }));
        check(JSON.stringify(data[field]) === JSON.stringify(expected),
          `${id}.${field} contains exactly the six expected WebPages in order`);
      }
      for (const [, path] of authorities) {
        const authority = await fetch(`./authority/${path}.html`);
        check(authority.ok, `${path}.html resolves`);
      }
      results.textContent += '\nDONE';
    }
    run().catch(error => {
      results.textContent += `\nFAIL: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
