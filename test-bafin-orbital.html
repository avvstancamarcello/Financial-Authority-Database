<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BaFin orbital regression checks</title>
</head>
<body>
    <h1>BaFin orbital regression checks</h1>
    <pre id="results">Running…</pre>
    <iframe id="app" title="Homepage under test" src="./index.html" width="1000" height="700"></iframe>
    <iframe id="authority" title="BaFin page under test" src="./authority/DE-BAFIN.html" width="1000" height="700"></iframe>
    <iframe id="cnmv" title="CNMV page under test" src="./authority/ES-CNMV.html" width="1000" height="700"></iframe>
    <script>
        const results = document.getElementById('results');
        const checks = [];

        function check(condition, message) {
            checks.push(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
            results.textContent = checks.join('\n');
            if (!condition) throw new Error(message);
        }

        async function waitFor(predicate) {
            const deadline = Date.now() + 20000;
            while (Date.now() < deadline) {
                if (predicate()) return;
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            throw new Error('Timed out waiting for page readiness');
        }

        async function run() {
            const appFrame = document.getElementById('app');
            const authorityFrame = document.getElementById('authority');
            await waitFor(() => appFrame.contentDocument.querySelector('#countriesGrid .country-card')
                && authorityFrame.contentDocument.querySelector('.thumbnail')?.naturalWidth);
            const app = appFrame.contentWindow;
            const doc = authorityFrame.contentDocument;
            const canonicalUrl = 'https://www.amevfirenze.it/authority/DE-BAFIN.html';
            const canonicalPath = new URL(canonicalUrl).pathname;
            check(doc.querySelectorAll('link[rel="canonical"]').length === 1
                && doc.querySelector('link[rel="canonical"]').href === canonicalUrl,
                'BaFin canonical uses the existing HTML page');
            check(new URL(authorityFrame.contentWindow.location.href).pathname.endsWith(canonicalPath),
                'Canonical HTML path resolves to the BaFin page');
            const legacyResponse = await fetch(`.${canonicalPath.slice(0, -1)}`);
            check(legacyResponse.ok, 'Legacy extension has a compatibility page instead of a 404');
            const legacyDoc = new DOMParser().parseFromString(await legacyResponse.text(), 'text/html');
            check(legacyDoc.querySelector('link[rel="canonical"]')?.getAttribute('href') === canonicalUrl
                && legacyDoc.querySelector('meta[http-equiv="refresh"]')?.getAttribute('content') === '0; url=DE-BAFIN.html'
                && new URL(legacyDoc.querySelector('a')?.getAttribute('href'), legacyResponse.url).pathname.endsWith(canonicalPath),
                'Compatibility page redirects immediately and links only to the canonical HTML page');
            check(doc.title === 'Deutschland BAFIN orbital WebApp'
                && doc.querySelector('h1').textContent === doc.title, 'Exact requested page title');
            check(doc.documentElement.lang === 'de', 'German page language');
            check(doc.querySelector('header .flag').textContent === '🇩🇪'
                && doc.querySelector('dl') && doc.querySelector('.note-block')
                && doc.querySelectorAll('.actions .btn').length === 4 && doc.querySelector('footer'),
                'CONSOB header, metadata, note, actions and footer structure');
            check([...doc.querySelectorAll('.section h3')].map(node => node.textContent[0]).join('') === 'ABCDEFGH',
                'Official resource sections A–H');
            check([...doc.querySelectorAll('a[href]')].every(link => {
                const url = new URL(link.href);
                return url.protocol === 'https:' && (url.hostname === 'www.bafin.de' || url.hostname.endsWith('.bafin.de'))
                    && link.target === '_blank' && link.rel.includes('noopener') && link.rel.includes('noreferrer');
            }), 'Only official BaFin resources and safe external links');
            check(doc.querySelector('.note-block').textContent.includes('nicht von der BaFin'),
                'Independent page disclaimer');

            const image = doc.querySelector('.thumbnail');
            check(image.getAttribute('src') === 'preview-DE-BAFIN.png'
                && image.naturalWidth === 820 && image.naturalHeight === 196, 'Existing PNG loads directly');
            for (const width of [1000, 375]) {
                authorityFrame.width = width;
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const style = authorityFrame.contentWindow.getComputedStyle(image);
                const contentWidth = parseFloat(style.width) - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth);
                const contentHeight = parseFloat(style.height) - parseFloat(style.borderTopWidth) - parseFloat(style.borderBottomWidth);
                check(Math.abs(contentWidth / contentHeight - 820 / 196) < 0.02
                    && style.objectFit === 'contain'
                    && doc.documentElement.scrollWidth <= authorityFrame.contentWindow.innerWidth,
                    `Uncropped responsive thumbnail and layout at ${width}px`);
            }

            for (const [page, thumbnail] of [
                ['IT-CONSOB.html', 'preview-consob.png'],
                ['UK-FCA.html', 'preview-fca.png'],
                ['FR-AMF.html', 'preview-FR-AMF.png'],
                ['DE-BAFIN.html', 'preview-DE-BAFIN.png'],
                ['ES-CNMV.html', 'preview-ES-CNMV.png']
            ]) {
                check(app.resolveConsobOrbitalSrc(`authority/${page}`).endsWith(`/authority/${page}`),
                    `Allowlisted page: ${page}`);
                check(app.resolveConsobOrbitalThumbnailSrc(`authority/${thumbnail}`).endsWith(`/authority/${thumbnail}`),
                    `Allowlisted thumbnail: ${thumbnail}`);
                check(app.resolveConsobOrbitalSrc(`https://example.org/authority/${page}`) === ''
                    && app.resolveConsobOrbitalThumbnailSrc(`https://example.org/authority/${thumbnail}`) === '',
                    `Reject cross-origin resources: ${page}`);
            }
            check(app.resolveConsobOrbitalSrc('authority/unknown.html') === ''
                && app.resolveConsobOrbitalThumbnailSrc('authority/unknown.png') === ''
                && app.resolveConsobOrbitalSrc('javascript:alert(1)') === '', 'Reject unallowlisted and unsafe resources');

            const germanyCard = appFrame.contentDocument.querySelector('.country-card[data-country-name="Germany"]');
            check(germanyCard?.querySelector('.orbital-thumbnail-trigger img')?.src.endsWith('/authority/preview-DE-BAFIN.png'),
                'Germany card preview hook');
            app.openModal('Germany');
            const trigger = appFrame.contentDocument.querySelector('#countryModal .orbital-thumbnail-trigger');
            check(trigger?.dataset.orbitalSrc.endsWith('/authority/DE-BAFIN.html'), 'Germany modal preview hook');
            await waitFor(() => trigger.querySelector('img').naturalWidth);
            const previewStyle = app.getComputedStyle(trigger.querySelector('img'));
            check(previewStyle.objectFit === 'contain'
                && Math.abs(parseFloat(previewStyle.width) / parseFloat(previewStyle.height) - 820 / 196) < 0.02,
                'Germany modal preview preserves aspect ratio');
            trigger.click();
            const orbitalFrame = appFrame.contentDocument.getElementById('consobOrbitalFrame');
            await waitFor(() => orbitalFrame.contentDocument.querySelector('h1')?.textContent === 'Deutschland BAFIN orbital WebApp');
            check(appFrame.contentDocument.getElementById('consobOrbitalDialog').open,
                'Germany hook opens BaFin in existing orbital dialog');
            app.closeItalyOrbitalDialog();
            app.closeModal();

            const cnmvFrame = document.getElementById('cnmv');
            await waitFor(() => cnmvFrame.contentDocument.querySelector('.thumbnail')?.naturalWidth);
            const cnmvDoc = cnmvFrame.contentDocument;
            check(cnmvDoc.querySelector('link[rel="canonical"]')?.href === 'https://www.amevfirenze.it/authority/ES-CNMV.html'
                && cnmvDoc.documentElement.lang === 'es'
                && cnmvDoc.title === 'CNMV España: registros, advertencias y reclamaciones | AMEV'
                && cnmvDoc.querySelector('h1').textContent === 'España CNMV orbital WebApp',
                'CNMV Spanish page and canonical HTML route');
            check(cnmvDoc.querySelector('meta[name="description"]')?.content
                === 'Ficha independiente de la CNMV en España: enlaces a registros oficiales, advertencias para inversores y canales de consultas y reclamaciones.',
                'CNMV description explains the independent official-resource guide');
            const homepageSource = new DOMParser().parseFromString(await (await fetch('./index.html')).text(), 'text/html');
            check(homepageSource.querySelector('#flagsGrid a[href="authority/ES-CNMV.html"]'),
                'CNMV flag link exists in initial HTML without JavaScript');
            const sitemap = new DOMParser().parseFromString(await (await fetch('./sitemap.xml')).text(), 'application/xml');
            check(!sitemap.querySelector('parsererror')
                && [...sitemap.getElementsByTagName('loc')].filter(node => node.textContent
                    === cnmvDoc.querySelector('link[rel="canonical"]').href).length === 1,
                'Sitemap contains the CNMV canonical URL exactly once');
            await waitFor(() => appFrame.contentDocument.querySelector('#flagsGrid a[href$="/authority/ES-CNMV.html"]'));
            const spainFlag = appFrame.contentDocument.querySelector('#flagsGrid a[href$="/authority/ES-CNMV.html"]');
            check(new URL(spainFlag.href).pathname === new URL(cnmvFrame.src).pathname,
                'Rendered Spain flag links directly to the existing CNMV HTML route');
            const modifiedClick = new app.MouseEvent('click', { bubbles: true, cancelable: true, ctrlKey: true });
            let modifiedClickPreserved = false;
            spainFlag.addEventListener('click', event => {
                modifiedClickPreserved = !event.defaultPrevented;
                event.preventDefault();
            }, { once: true });
            spainFlag.dispatchEvent(modifiedClick);
            check(modifiedClickPreserved, 'Modified flag click preserves native link navigation');
            spainFlag.click();
            check(appFrame.contentDocument.getElementById('countryModal').style.display === 'block'
                && appFrame.contentDocument.querySelector('#countryModal .orbital-thumbnail-trigger')
                    ?.dataset.orbitalSrc.endsWith('/authority/ES-CNMV.html'),
                'Normal Spain flag click preserves the country modal and CNMV hook');
            app.closeModal();
            check(cnmvDoc.querySelector('header .flag').textContent === '🇪🇸'
                && cnmvDoc.querySelector('dl') && cnmvDoc.querySelector('.badge')
                && cnmvDoc.querySelector('.note-block').textContent.includes('No está publicada, certificada ni avalada por la CNMV')
                && cnmvDoc.querySelectorAll('.actions .btn').length === 4
                && cnmvDoc.querySelector('footer')
                && [...cnmvDoc.querySelectorAll('.section h3')].map(node => node.textContent[0]).join('') === 'ABCDEFGH',
                'CNMV orbital structure and independent disclaimer');
            check([...cnmvDoc.querySelectorAll('a[href]')].every(link => {
                const url = new URL(link.href);
                return url.protocol === 'https:' && url.hostname === 'www.cnmv.es'
                    && link.target === '_blank' && link.rel.includes('noopener') && link.rel.includes('noreferrer');
            }), 'Only official CNMV resources and safe external links');
            const cnmvImage = cnmvDoc.querySelector('.thumbnail');
            check(cnmvImage.getAttribute('src') === 'preview-ES-CNMV.png'
                && cnmvImage.naturalWidth === 1280 && cnmvImage.naturalHeight === 1280,
                'Supplied CNMV preview loads at the requested path');
            for (const width of [1000, 375]) {
                cnmvFrame.width = width;
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const style = cnmvFrame.contentWindow.getComputedStyle(cnmvImage);
                check(Math.abs(parseFloat(style.width) / parseFloat(style.height) - 1) < 0.02
                    && parseFloat(style.width) <= 160 && parseFloat(style.height) <= 160
                    && style.objectFit === 'contain'
                    && cnmvDoc.documentElement.scrollWidth <= cnmvFrame.contentWindow.innerWidth,
                    `Uncropped CNMV thumbnail and layout at ${width}px`);
            }
            const spainCard = appFrame.contentDocument.querySelector('.country-card[data-country-name="Spain"]');
            const spainCardTrigger = spainCard?.querySelector('.orbital-thumbnail-trigger');
            check(spainCardTrigger?.querySelector('img')?.src.endsWith('/authority/preview-ES-CNMV.png'),
                'Spain card preview hook');
            spainCardTrigger.click();
            await waitFor(() => orbitalFrame.contentDocument.querySelector('h1')?.textContent === 'España CNMV orbital WebApp');
            check(appFrame.contentDocument.getElementById('consobOrbitalDialog').open,
                'Spain card hook opens CNMV orbital dialog');
            app.closeItalyOrbitalDialog();
            app.openModal('Spain');
            const spainTrigger = appFrame.contentDocument.querySelector('#countryModal .orbital-thumbnail-trigger');
            check(spainTrigger?.dataset.orbitalSrc.endsWith('/authority/ES-CNMV.html'),
                'Spain country modal preview hook');
            await waitFor(() => spainTrigger.querySelector('img').naturalWidth);
            const spainPreviewStyle = app.getComputedStyle(spainTrigger.querySelector('img'));
            check(spainPreviewStyle.objectFit === 'contain'
                && Math.abs(parseFloat(spainPreviewStyle.width) / parseFloat(spainPreviewStyle.height) - 1) < 0.02,
                'Spain modal preview preserves supplied logo proportions');
            spainTrigger.click();
            await waitFor(() => orbitalFrame.contentDocument.querySelector('h1')?.textContent === 'España CNMV orbital WebApp');
            check(appFrame.contentDocument.getElementById('consobOrbitalDialog').open,
                'Spain country modal hook opens CNMV orbital dialog');
            app.closeItalyOrbitalDialog();
            app.closeModal();

            for (const [country, page] of [['Italy', 'IT-CONSOB.html'], ['United Kingdom', 'UK-FCA.html'], ['France', 'FR-AMF.html']]) {
                app.openModal(country);
                check(appFrame.contentDocument.querySelector('#countryModal .orbital-thumbnail-trigger')?.dataset.orbitalSrc.endsWith(`/authority/${page}`),
                    `Existing ${country} modal hook preserved`);
                app.closeModal();
            }
            results.dataset.status = 'passed';
            results.textContent += '\nAll checks passed.';
        }

        run().catch(error => {
            results.dataset.status = 'failed';
            results.textContent += `\nERROR: ${error.message}`;
        });
    </script>
</body>
</html>
