<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test referenze — meta description</title>
</head>
<body>
  <h1>Test referenze — meta description</h1>
  <pre id="results">Running…</pre>
  <script>
    const results = document.getElementById('results');
    const checks = [];
    function check(condition, message) {
      checks.push(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
      results.textContent = checks.join('\n');
      if (!condition) throw new Error(message);
    }
    async function run() {
      const response = await fetch('./referenze.html');
      check(response.ok, 'References page resolves');
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const descriptions = page.head.querySelectorAll('meta[name="description"]');
      check(descriptions.length === 1, 'Exactly one meta description is present');
      check(descriptions[0].content === 'Database che offre link alle Autorità Internazionali di supervisione finanziaria, competenti per regioni geografiche continentali',
        'Meta description matches the requested Italian database bio');
      results.textContent += '\nDONE';
    }
    run().catch(error => {
      results.textContent += `\nFAIL: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
