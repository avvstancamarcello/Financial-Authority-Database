        const results = document.getElementById('results');

        function addResult(ok, message) {
            const li = document.createElement('li');
            li.className = ok ? 'pass' : 'fail';
            li.textContent = `${ok ? 'PASS' : 'FAIL'} - ${message}`;
            results.appendChild(li);
            if (!ok) {
                document.body.dataset.testStatus = 'fail';
            }
        }

        function waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang, attempts = 0) {
            return new Promise((resolve, reject) => {
                const check = () => {
                    try {
                        const doc = iframe.contentDocument;
                        const html = doc?.documentElement;
                        const canonical = doc?.getElementById('canonical-url')?.getAttribute('href');
                        const activeButton = doc?.querySelector(`.lang-btn.active[data-lang="${lang}"]`);
                        if (html?.lang === expectedHtmlLang && canonical === expectedCanonical && activeButton) {
                            resolve();
                            return;
                        }
                        if (attempts >= 30) {
                            reject(new Error(`timed out waiting for ${lang} locale state`));
                            return;
                        }
                        window.requestAnimationFrame(() => {
                            waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang, attempts + 1).then(resolve).catch(reject);
                        });
                    } catch (error) {
                        reject(error);
                    }
                };
                check();
            });
        }

        function loadScenario({ lang, expectedHtmlLang, expectedCanonical, expectedTitle, expectedOgTitle, expectedOgDescription, expectedOgImageAlt, expectedTwitterTitle, expectedTwitterDescription, expectedTwitterImageAlt, expectedFaqHeading, expectedFaqQuestion1, expectedMedusaLabel, expectedMedusaTitle, expectedMedusaAriaLabel, expectedMedusaBadge, expectedMetaDescriptionIncludes, expectedHeroTitle, expectedHeroSubtitle, expectedLanguageSelectorTitle, expectedLanguageSelectorNote, expectedFutureLanguagesTitle, expectedFutureLanguagesNote, expectedChooseLanguageHint, expectedNavDatabase, expectedNavOdyssey, expectedNavReferences, requiredText }) {
            return new Promise((resolve) => {
                const iframe = document.createElement('iframe');
                iframe.style.position = 'absolute';
                iframe.style.left = '-9999px';
                iframe.style.top = '0';
                iframe.style.width = '1440px';
                iframe.style.height = '2400px';
                iframe.style.visibility = 'hidden';
                iframe.src = 'index.html';
                iframe.onload = () => {
                    const win = iframe.contentWindow;
                    if (typeof win.changeLanguage !== 'function') {
                        addResult(false, `${lang}: changeLanguage is unavailable after load`);
                        iframe.remove();
                        resolve();
                        return;
                    }
                    win.changeLanguage(lang);
                    waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang).then(() => {
                    try {
                        const doc = iframe.contentDocument;
                        const html = doc.documentElement;
                        const canonical = doc.getElementById('canonical-url')?.getAttribute('href');
                        const metaDescription = doc.getElementById('meta-description')?.getAttribute('content') || '';
                        const metaOgTitle = doc.getElementById('meta-og-title')?.getAttribute('content') || '';
                        const metaOgDescription = doc.getElementById('meta-og-description')?.getAttribute('content') || '';
                        const metaOgImageAlt = doc.getElementById('meta-og-image-alt')?.getAttribute('content') || '';
                        const metaTwitterTitle = doc.getElementById('meta-twitter-title')?.getAttribute('content') || '';
                        const metaTwitterDescription = doc.getElementById('meta-twitter-description')?.getAttribute('content') || '';
                        const metaTwitterImageAlt = doc.getElementById('meta-twitter-image-alt')?.getAttribute('content') || '';
                        const faqHeading = doc.querySelector('#faq-section [data-i18n-text=\"faqSectionTitle\"]')?.textContent?.trim();
                        const medusaCta = doc.getElementById('caravaggio-medusa-link');
                        const faqSchemaRaw = doc.getElementById('faq-schema-jsonld')?.textContent || '';
                        let faqSchema = null;
                        try {
                            faqSchema = faqSchemaRaw ? JSON.parse(faqSchemaRaw) : null;
                        } catch (parseError) {
                            addResult(false, `${lang}: FAQ JSON-LD parse error (${parseError.message})`);
                        }
                        const activeButton = doc.querySelector(`.lang-btn.active[data-lang="${lang}"]`);
                        const asiaSection = doc.getElementById('languages-asia');
                        const buttonText = doc.querySelector('.language-selector-eu .lang-btn[data-lang="bs"]')?.textContent || '';
                        const firstQuestion = faqSchema?.mainEntity?.[0]?.name || '';
                        const referencesNavLink = doc.querySelector('nav a[href="referenze.html"]');
                        const referencesNavLabel = referencesNavLink?.querySelector('span')?.textContent?.trim() || '';
                        const header = doc.querySelector('header[role="banner"]');
                        const headerOrder = Array.from(header?.children || []).map((element) => {
                            if (element.classList.contains('flag-orbit-banner')) return 'flags';
                            if (element.matches('h1')) return 'title';
                            if (element.classList.contains('subtitle')) return 'subtitle';
                            if (element.classList.contains('language-selector')) return 'languages';
                            if (element.classList.contains('amev-introduction')) return 'intro';
                            return element.tagName.toLowerCase();
                        });
                        const languageSelector = doc.querySelector('.language-selector');
                        const euGrid = doc.querySelector('.language-selector-eu .language-selector-grid');
                        const asiaGrid = doc.querySelector('.language-selector-asia .language-selector-grid');
                        const euAreaLabel = doc.getElementById('language-selector-eu-area-label');
                        const asiaAreaLabel = doc.getElementById('language-selector-asia-area-label');
                        const euAreaText = euAreaLabel?.querySelector('[data-i18n-text="languageAreaEu"]')?.textContent?.trim() || '';
                        const euPromptText = euAreaLabel?.querySelector('[data-i18n-text="languagePrompt"]')?.textContent?.trim() || '';
                        const asiaAreaText = asiaAreaLabel?.querySelector('[data-i18n-text="languageAreaAsia"]')?.textContent?.trim() || '';

                            Array.from(flag.classList).find((className) => className.startsWith('fi-') && className !== 'fi')

                        const euDataLangOrder = euButtons.map((btn) => btn.getAttribute('data-lang'));

                            if (btn.dataset.lang === 'xk') return 'XK';
                            const codeFromLabel = (btn.textContent || '').trim().split(/\s+/)[0];
                            return (codeFromLabel || '').toUpperCase();
                        });
                        const expectedEuDataLangOrder = ['en', 'es', 'pt', 'fr', 'de', 'it', 'nl', 'ro', 'el', 'sq', 'xk', 'bs'];
                        const expectedEuVisibleCodeOrder = ['EN', 'ES', 'PT', 'FR', 'DE', 'IT', 'NL', 'RO', 'EL', 'AL', 'XK', 'BS'];

                        const asiaFirstGridRow = asiaGrid?.firstElementChild;

                        const amevDisclosureContent = doc.getElementById('amev-introduction-content');

                        addResult(html?.lang === expectedHtmlLang, `${lang}: html lang is ${expectedHtmlLang}`);
                        addResult(canonical === expectedCanonical, `${lang}: canonical is ${expectedCanonical}`);
                        addResult(doc.title === expectedTitle, `${lang}: document.title is localized`);
                        addResult(metaDescription.includes(expectedMetaDescriptionIncludes), `${lang}: meta description is localized/fallback`);
                        addResult(metaOgTitle === expectedOgTitle, `${lang}: og:title is localized/fallback`);
                        addResult(metaOgDescription === expectedOgDescription, `${lang}: og:description is localized/fallback`);
                        addResult(metaOgImageAlt === expectedOgImageAlt, `${lang}: og:image:alt is localized/fallback`);

                        addResult(medusaCta?.querySelector('.medusa-cta-label')?.textContent?.trim() === expectedMedusaLabel, `${lang}: Codice Caravaggio CTA label matches expected localized/fallback value`);
                        addResult(medusaCta?.getAttribute('title') === expectedMedusaTitle, `${lang}: Codice Caravaggio CTA title matches expected localized/fallback value`);
                        addResult(medusaCta?.getAttribute('aria-label') === expectedMedusaAriaLabel, `${lang}: Codice Caravaggio CTA aria-label matches expected localized/fallback value`);
                        addResult(medusaCta?.querySelector('.medusa-cta-badge')?.textContent?.trim() === expectedMedusaBadge, `${lang}: Codice Caravaggio CTA badge matches expected localized/fallback value`);
                        addResult(firstQuestion === expectedFaqQuestion1, `${lang}: FAQ JSON-LD is localized/fallback`);
                        addResult(Boolean(activeButton), `${lang}: active language button is selected`);
                        addResult(Boolean(asiaSection), `${lang}: ASIA anchor section remains present`);
                        addResult(Boolean(referencesNavLink), `${lang}: references navigation link exists`);
                        addResult(referencesNavLink?.getAttribute('href') === 'referenze.html', `${lang}: references navigation link still points to referenze.html`);
                        if (expectedNavReferences) {
                            addResult(referencesNavLabel === expectedNavReferences, `${lang}: references nav label matches expected localized/fallback value`);
                        }
                        addResult(referencesNavLabel !== obsoleteNavReferences, `${lang}: references nav runtime label is not the obsolete Italian copy`);
                        requiredText.forEach((text) => addResult(doc.body.textContent.includes(text), `${lang}: body contains ${text}`));
                        addResult(typeof win.getInstructionsContent === 'function', `${lang}: instructions localization runtime is available`);
                        addResult(headerOrder.indexOf('flags') === 0, `${lang}: shields and flag carousels render first in the landing header`);
                        addResult(headerOrder.indexOf('title') > headerOrder.indexOf('flags'), `${lang}: main title appears after the flag/shield block`);
                        addResult(headerOrder.indexOf('languages') > headerOrder.indexOf('title'), `${lang}: language selector appears after the main title`);
                        addResult(headerOrder.indexOf('intro') > headerOrder.indexOf('languages'), `${lang}: AMEV intro follows the language selector`);
                        addResult(languageSelector?.dataset.layout === 'compact', `${lang}: language selector outer shell is marked as compact`);
                        addResult(euGrid?.dataset.layout === 'row-wrap', `${lang}: EU language buttons are grouped as horizontal row wraps`);
                        addResult(asiaGrid?.dataset.layout === 'row-wrap', `${lang}: reserved future-language buttons are grouped as horizontal row wraps`);
                        addResult(asiaSection?.dataset.placeholder === 'compact' && reservedPlaceholder?.textContent?.includes('WIP'), `${lang}: future-language placeholder remains marked as a compact reserved area`);
                        addResult(JSON.stringify(euDataLangOrder) === JSON.stringify(expectedEuDataLangOrder), `${lang}: EU language data-lang DOM order matches EN, ES, PT, FR, DE, IT, NL, RO, EL, AL, XK, BS`);
                        addResult(JSON.stringify(euVisibleCodeOrder) === JSON.stringify(expectedEuVisibleCodeOrder), `${lang}: EU language visible code order matches EN, ES, PT, FR, DE, IT, NL, RO, EL, AL, XK, BS`);
                        addResult((new Set(euDataLangOrder)).size === euDataLangOrder.length, `${lang}: EU language selector has no duplicate buttons`);
                        if (lang === 'it') {
                            const labelLocales = Object.keys(translationMap || {}).filter((locale) =>
                                translationMap?.[locale] && typeof translationMap[locale] === 'object'
                            );
                            const missingAreaLabelLocales = labelLocales.filter((locale) =>

                            );
                            addResult(missingAreaLabelLocales.length === 0, 'it: all translation bundles define area-row and AMEV disclosure keys');
                        }

                    } catch (error) {
                        addResult(false, `${lang}: ${error.message}`);
                    } finally {
                        iframe.remove();
                        resolve();
