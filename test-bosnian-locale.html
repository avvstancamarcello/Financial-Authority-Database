        function getVisibilitySnapshot(win, element) {

            const rect = element.getBoundingClientRect();

                visibility: computed.visibility,
                opacity: computed.opacity,
                overflow: computed.overflow,
                width: rect.width,
                height: rect.height,
                minWidth: computed.minWidth,
                order: computed.order,
                position: computed.position,
                zIndex: computed.zIndex,
                left: rect.left,
                right: rect.right,
                top: rect.top,
                bottom: rect.bottom,
                gridTemplateColumns: computed.gridTemplateColumns
            };
        }

        function waitForCondition(check, { attempts = 60, errorMessage = 'timed out waiting for condition' } = {}) {
            return new Promise((resolve, reject) => {
                const poll = (remaining) => {
                    let passed = false;
                    try {
                        passed = Boolean(check());
                    } catch (error) {
                        reject(error);
                        return;
                    }
                    if (passed) {
                        resolve();
                        return;
                    }
                    if (remaining <= 0) {
                        reject(new Error(errorMessage));
                        return;
                    }
                    window.requestAnimationFrame(() => poll(remaining - 1));
                };
                poll(attempts);
            });
        }

                            resolve();
                            return;
                        }
                        if (attempts >= 30) {
                            reject(new Error(`timed out waiting for ${lang} locale state`));
                            return;
                        }
                        window.requestAnimationFrame(() => {
                            waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang, attempts + 1).then(resolve).catch(reject);
                        });
                    } catch (error) {
                        reject(error);
                    }
                };
                check();
            });

                                addResult(responsiveMedusa?.display !== 'none' && responsiveScam?.display !== 'none' && responsiveMedusa?.width > 0 && responsiveScam?.width > 0, `it: ${viewport.label} keeps both top CTAs rendered with non-zero size`);
                                if (viewport.expectStackedCtas) {
                                    addResult(responsiveScam?.top >= responsiveMedusa?.bottom, `it: ${viewport.label} stacks Scam Radar below Codice Caravaggio`);
                                    addResult(responsiveFilterGroup?.top >= responsiveScam?.bottom, `it: ${viewport.label} keeps filter buttons below both CTAs`);
                                } else {
                                    addResult(responsiveScam?.top === responsiveMedusa?.top && responsiveScam?.left > responsiveMedusa?.left, `it: ${viewport.label} keeps the two top CTAs side by side`);
                                    addResult(responsiveFilterGroup?.top >= responsiveMedusa?.bottom, `it: ${viewport.label} keeps filter buttons on the row below the two CTAs`);
                                }
                            }
                        }
                        const switchedDisclosureToggle = switchedDoc.getElementById('amev-introduction-toggle');
                        const switchedDisclosureContent = switchedDoc.getElementById('amev-introduction-content');
                        addResult(switchedDisclosureToggle?.getAttribute('aria-expanded') === 'true' && switchedDisclosureContent?.hidden === false, `${lang}→en: AMEV disclosure state remains expanded after runtime language switch`);
                        switchedDisclosureToggle?.click();
                        addResult(switchedDisclosureToggle?.getAttribute('aria-expanded') === 'false' && switchedDisclosureContent?.hidden === true, `${lang}→en: AMEV disclosure remains operable after language switch`);
                    } catch (error) {
                        addResult(false, `${lang}: ${error.message}`);
                    } finally {
                        iframe.remove();
                        resolve();
                    }
                    }).catch((error) => {
                        addResult(false, `${lang}: ${error.message}`);
                        iframe.remove();
                        resolve();
                    });
                };
                document.body.appendChild(iframe);
            });
        }

        (async () => {
            document.body.dataset.testStatus = 'pass';
            for (const scenario of scenarios) {
                await loadScenario(scenario);
            }
        })();
    </script>
</body>
