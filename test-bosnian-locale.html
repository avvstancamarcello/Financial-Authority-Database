<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosnian locale regression test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
        .pass { color: #22c55e; }
        .fail { color: #ef4444; }
        code { background: rgba(255,255,255,0.08); padding: 0.15rem 0.35rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Bosnian locale regression test</h1>
    <ul id="results"></ul>
    <script>
        const scenarios = [
            {
                lang: 'it',
                expectedHtmlLang: 'it',
                expectedCanonical: 'https://tutelatruffe.it/',
                expectedTitle: "Database Autorità Finanziarie Internazionali | Verifica Licenze Broker | 239 Paesi",
                expectedOgTitle: "Tutela Truffe | Database Autorità Finanziarie UE - Odissea Digitale",
                expectedOgDescription: "🌍 Database di 239 autorità finanziarie internazionali. Verifica licenze broker, identità delle imprese e percorsi lingua AMEV / AMEA / AWEV per prevenire frodi Forex/Crypto.",
                expectedOgImageAlt: "Tutela Truffe - Database Autorità Finanziarie e Mappa Europea Truffe",
                expectedTwitterTitle: "🌊 Odissea Digitale | Recupera i Tuoi Capitali dalle Truffe",
                expectedTwitterDescription: "Database 239 Autorità Internazionali + Mappa Truffe Geolocalizzata. Segnala Forex/Crypto/Pig Butchering. Come Ulisse tornò a Itaca, riconquista il tuo Vello d'Oro.",
                expectedTwitterImageAlt: "Tutela Truffe - Mappa Europea Truffe Finanziarie",
                expectedFaqHeading: "❓ Domande Frequenti – FAQ",
                expectedFaqQuestion1: "Come verificare se un broker è autorizzato?",
                expectedMetaDescriptionIncludes: "percorsi lingua AMEV / AMEA / AWEV",
                requiredText: ['Italiano', 'Domande Frequenti']
            },
            {
                lang: 'bs',
                expectedHtmlLang: 'bs-BA',
                expectedCanonical: 'https://tutelatruffe.it/?lang=bs',
                expectedTitle: "International Financial Authorities Database | Verify Broker Licenses | 239 Countries",
                expectedOgTitle: "Scam Protection | EU Financial Authorities Database - Digital Odyssey",
                expectedOgDescription: "🌍 Database of 239 international financial authorities. Verify broker licenses, company identities, and AMEV / AMEA / AWEV language paths for Forex/Crypto fraud prevention.",
                expectedOgImageAlt: "Scam Protection - Financial Authorities Database and European Scam Map",
                expectedTwitterTitle: "🌊 Digital Odyssey | Recover Your Capital from Scams",
                expectedTwitterDescription: "Database of 239 international authorities + geolocated scam map. Report Forex/Crypto/Pig Butchering scams and verify financial operators.",
                expectedTwitterImageAlt: "Scam Protection - European Financial Scam Map",
                expectedFaqHeading: "❓ Frequently Asked Questions – FAQ",
                expectedFaqQuestion1: "How can I verify whether a broker is authorized?",
                expectedMetaDescriptionIncludes: "AMEV / AMEA / AWEV language paths",
                requiredText: ['Bosanski', 'Međunarodna baza finansijskih autoriteta']
            },
            {
                lang: 'el',
                expectedHtmlLang: 'el',
                expectedCanonical: 'https://tutelatruffe.it/?lang=el',
                expectedTitle: "International Financial Authorities Database | Verify Broker Licenses | 239 Countries",
                expectedOgTitle: "Scam Protection | EU Financial Authorities Database - Digital Odyssey",
                expectedOgDescription: "🌍 Database of 239 international financial authorities. Verify broker licenses, company identities, and AMEV / AMEA / AWEV language paths for Forex/Crypto fraud prevention.",
                expectedOgImageAlt: "Scam Protection - Financial Authorities Database and European Scam Map",
                expectedTwitterTitle: "🌊 Digital Odyssey | Recover Your Capital from Scams",
                expectedTwitterDescription: "Database of 239 international authorities + geolocated scam map. Report Forex/Crypto/Pig Butchering scams and verify financial operators.",
                expectedTwitterImageAlt: "Scam Protection - European Financial Scam Map",
                expectedFaqHeading: "❓ Frequently Asked Questions – FAQ",
                expectedFaqQuestion1: "How can I verify whether a broker is authorized?",
                expectedMetaDescriptionIncludes: "AMEV / AMEA / AWEV language paths",
                requiredText: ['Ελληνικά']
            },
            {
                lang: 'ar',
                expectedHtmlLang: 'ar',
                expectedCanonical: 'https://tutelatruffe.it/?lang=ar',
                expectedTitle: "International Financial Authorities Database | Verify Broker Licenses | 239 Countries",
                expectedOgTitle: "Scam Protection | EU Financial Authorities Database - Digital Odyssey",
                expectedOgDescription: "🌍 Database of 239 international financial authorities. Verify broker licenses, company identities, and AMEV / AMEA / AWEV language paths for Forex/Crypto fraud prevention.",
                expectedOgImageAlt: "Scam Protection - Financial Authorities Database and European Scam Map",
                expectedTwitterTitle: "🌊 Digital Odyssey | Recover Your Capital from Scams",
                expectedTwitterDescription: "Database of 239 international authorities + geolocated scam map. Report Forex/Crypto/Pig Butchering scams and verify financial operators.",
                expectedTwitterImageAlt: "Scam Protection - European Financial Scam Map",
                expectedFaqHeading: "❓ Frequently Asked Questions – FAQ",
                expectedFaqQuestion1: "How can I verify whether a broker is authorized?",
                expectedMetaDescriptionIncludes: "AMEV / AMEA / AWEV language paths",
                requiredText: ['AR']
            },
            {
                lang: 'xk',
                expectedHtmlLang: 'sq-XK',
                expectedCanonical: 'https://tutelatruffe.it/?lang=xk',
                expectedTitle: "International Financial Authorities Database | Verify Broker Licenses | 239 Countries",
                expectedOgTitle: "Scam Protection | EU Financial Authorities Database - Digital Odyssey",
                expectedOgDescription: "🌍 Database of 239 international financial authorities. Verify broker licenses, company identities, and AMEV / AMEA / AWEV language paths for Forex/Crypto fraud prevention.",
                expectedOgImageAlt: "Scam Protection - Financial Authorities Database and European Scam Map",
                expectedTwitterTitle: "🌊 Digital Odyssey | Recover Your Capital from Scams",
                expectedTwitterDescription: "Database of 239 international authorities + geolocated scam map. Report Forex/Crypto/Pig Butchering scams and verify financial operators.",
                expectedTwitterImageAlt: "Scam Protection - European Financial Scam Map",
                expectedFaqHeading: "❓ Frequently Asked Questions – FAQ",
                expectedFaqQuestion1: "How can I verify whether a broker is authorized?",
                expectedMetaDescriptionIncludes: "AMEV / AMEA / AWEV language paths",
                requiredText: ['XK', 'Shqip']
            }
        ];
        const expectedEnState = {
            htmlLang: 'en',
            canonical: 'https://tutelatruffe.it/?lang=en',
            title: "International Financial Authorities Database | Verify Broker Licenses | 239 Countries",
            ogTitle: "Scam Protection | EU Financial Authorities Database - Digital Odyssey",
            ogDescription: "🌍 Database of 239 international financial authorities. Verify broker licenses, company identities, and AMEV / AMEA / AWEV language paths for Forex/Crypto fraud prevention.",
            metaDescriptionIncludes: "AMEV / AMEA / AWEV language paths",
            ogImageAlt: "Scam Protection - Financial Authorities Database and European Scam Map",
            twitterTitle: "🌊 Digital Odyssey | Recover Your Capital from Scams",
            twitterDescription: "Database of 239 international authorities + geolocated scam map. Report Forex/Crypto/Pig Butchering scams and verify financial operators.",
            twitterImageAlt: "Scam Protection - European Financial Scam Map",
            faqQuestion1: "How can I verify whether a broker is authorized?"
        };

        const results = document.getElementById('results');

        function addResult(ok, message) {
            const li = document.createElement('li');
            li.className = ok ? 'pass' : 'fail';
            li.textContent = `${ok ? 'PASS' : 'FAIL'} - ${message}`;
            results.appendChild(li);
            if (!ok) {
                document.body.dataset.testStatus = 'fail';
            }
        }

        function waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang, attempts = 0) {
            return new Promise((resolve, reject) => {
                const check = () => {
                    try {
                        const doc = iframe.contentDocument;
                        const html = doc?.documentElement;
                        const canonical = doc?.getElementById('canonical-url')?.getAttribute('href');
                        const activeButton = doc?.querySelector(`.lang-btn.active[data-lang="${lang}"]`);
                        if (html?.lang === expectedHtmlLang && canonical === expectedCanonical && activeButton) {
                            resolve();
                            return;
                        }
                        if (attempts >= 30) {
                            reject(new Error(`timed out waiting for ${lang} locale state`));
                            return;
                        }
                        window.requestAnimationFrame(() => {
                            waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang, attempts + 1).then(resolve).catch(reject);
                        });
                    } catch (error) {
                        reject(error);
                    }
                };
                check();
            });
        }

        function loadScenario({ lang, expectedHtmlLang, expectedCanonical, expectedTitle, expectedOgTitle, expectedOgDescription, expectedOgImageAlt, expectedTwitterTitle, expectedTwitterDescription, expectedTwitterImageAlt, expectedFaqHeading, expectedFaqQuestion1, expectedMetaDescriptionIncludes, requiredText }) {
            return new Promise((resolve) => {
                const iframe = document.createElement('iframe');
                iframe.style.position = 'absolute';
                iframe.style.left = '-9999px';
                iframe.style.top = '0';
                iframe.style.width = '1440px';
                iframe.style.height = '2400px';
                iframe.style.visibility = 'hidden';
                iframe.src = 'index.html';
                iframe.onload = () => {
                    const win = iframe.contentWindow;
                    if (typeof win.changeLanguage !== 'function') {
                        addResult(false, `${lang}: changeLanguage is unavailable after load`);
                        iframe.remove();
                        resolve();
                        return;
                    }
                    win.changeLanguage(lang);
                    waitForLocaleState(iframe, expectedHtmlLang, expectedCanonical, lang).then(() => {
                    try {
                        const doc = iframe.contentDocument;
                        const html = doc.documentElement;
                        const canonical = doc.getElementById('canonical-url')?.getAttribute('href');
                        const metaDescription = doc.getElementById('meta-description')?.getAttribute('content') || '';
                        const metaOgTitle = doc.getElementById('meta-og-title')?.getAttribute('content') || '';
                        const metaOgDescription = doc.getElementById('meta-og-description')?.getAttribute('content') || '';
                        const metaOgImageAlt = doc.getElementById('meta-og-image-alt')?.getAttribute('content') || '';
                        const metaTwitterTitle = doc.getElementById('meta-twitter-title')?.getAttribute('content') || '';
                        const metaTwitterDescription = doc.getElementById('meta-twitter-description')?.getAttribute('content') || '';
                        const metaTwitterImageAlt = doc.getElementById('meta-twitter-image-alt')?.getAttribute('content') || '';
                        const faqHeading = doc.querySelector('#faq-section [data-i18n-text=\"faqSectionTitle\"]')?.textContent?.trim();
                        const faqSchemaRaw = doc.getElementById('faq-schema-jsonld')?.textContent || '';
                        let faqSchema = null;
                        try {
                            faqSchema = faqSchemaRaw ? JSON.parse(faqSchemaRaw) : null;
                        } catch (parseError) {
                            addResult(false, `${lang}: FAQ JSON-LD parse error (${parseError.message})`);
                        }
                        const activeButton = doc.querySelector(`.lang-btn.active[data-lang="${lang}"]`);
                        const asiaSection = doc.getElementById('languages-asia');
                        const buttonText = doc.querySelector('.language-selector-eu .lang-btn[data-lang="bs"]')?.textContent || '';
                        const firstQuestion = faqSchema?.mainEntity?.[0]?.name || '';
                        const header = doc.querySelector('header[role="banner"]');
                        const headerOrder = Array.from(header?.children || []).map((element) => {
                            if (element.classList.contains('flag-orbit-banner')) return 'flags';
                            if (element.matches('h1')) return 'title';
                            if (element.classList.contains('subtitle')) return 'subtitle';
                            if (element.classList.contains('language-selector')) return 'languages';
                            if (element.classList.contains('amev-introduction')) return 'intro';
                            return element.tagName.toLowerCase();
                        });
                        const languageSelector = doc.querySelector('.language-selector');
                        const euGrid = doc.querySelector('.language-selector-eu .language-selector-grid');
                        const asiaGrid = doc.querySelector('.language-selector-asia .language-selector-grid');
                        const reservedPlaceholder = doc.querySelector('.language-selector-asia .lang-btn-placeholder');

                        addResult(html?.lang === expectedHtmlLang, `${lang}: html lang is ${expectedHtmlLang}`);
                        addResult(canonical === expectedCanonical, `${lang}: canonical is ${expectedCanonical}`);
                        addResult(doc.title === expectedTitle, `${lang}: document.title is localized`);
                        addResult(metaDescription.includes(expectedMetaDescriptionIncludes), `${lang}: meta description is localized/fallback`);
                        addResult(metaOgTitle === expectedOgTitle, `${lang}: og:title is localized/fallback`);
                        addResult(metaOgDescription === expectedOgDescription, `${lang}: og:description is localized/fallback`);
                        addResult(metaOgImageAlt === expectedOgImageAlt, `${lang}: og:image:alt is localized/fallback`);
                        addResult(metaTwitterTitle === expectedTwitterTitle, `${lang}: twitter:title is localized/fallback`);
                        addResult(metaTwitterDescription === expectedTwitterDescription, `${lang}: twitter:description is localized/fallback`);
                        addResult(metaTwitterImageAlt === expectedTwitterImageAlt, `${lang}: twitter:image:alt is localized/fallback`);
                        addResult(faqHeading === expectedFaqHeading, `${lang}: FAQ heading is localized/fallback`);
                        addResult(firstQuestion === expectedFaqQuestion1, `${lang}: FAQ JSON-LD is localized/fallback`);
                        addResult(Boolean(activeButton), `${lang}: active language button is selected`);
                        addResult(Boolean(asiaSection), `${lang}: ASIA anchor section remains present`);
                        requiredText.forEach((text) => addResult(doc.body.textContent.includes(text), `${lang}: body contains ${text}`));
                        addResult(typeof win.getInstructionsContent === 'function', `${lang}: instructions localization runtime is available`);
                        addResult(headerOrder.indexOf('flags') === 0, `${lang}: shields and flag carousels render first in the landing header`);
                        addResult(headerOrder.indexOf('title') > headerOrder.indexOf('flags'), `${lang}: main title appears after the flag/shield block`);
                        addResult(headerOrder.indexOf('languages') > headerOrder.indexOf('title'), `${lang}: language selector appears after the main title`);
                        addResult(headerOrder.indexOf('intro') > headerOrder.indexOf('languages'), `${lang}: AMEV intro follows the language selector`);
                        addResult(languageSelector?.dataset.layout === 'compact', `${lang}: language selector outer shell is marked as compact`);
                        addResult(euGrid?.dataset.layout === 'row-wrap', `${lang}: EU language buttons are grouped as horizontal row wraps`);
                        addResult(asiaGrid?.dataset.layout === 'row-wrap', `${lang}: reserved future-language buttons are grouped as horizontal row wraps`);
                        addResult(asiaSection?.dataset.placeholder === 'compact' && reservedPlaceholder?.textContent?.includes('WIP'), `${lang}: future-language placeholder remains marked as a compact reserved area`);
                        addResult((doc.querySelector('#amev-introduction-title')?.textContent || '').includes('AME') && !(doc.body.textContent.includes('11 European languages') || doc.body.textContent.includes('11 lingue europee')), `${lang}: updated AMEV/AMEA/AWEV landing copy replaces the obsolete 11-language claim`);
                        if (lang === 'bs') {
                            addResult(buttonText.includes('BS') && buttonText.includes('Bosanski'), 'bs: EU selector shows BS and Bosanski');
                            addResult(doc.querySelector('link[hreflang="bs"]')?.href === 'https://tutelatruffe.it/?lang=bs', 'bs: hreflang bs points to Bosnian URL');
                            addResult(doc.querySelector('link[hreflang="bs-BA"]')?.href === 'https://tutelatruffe.it/?lang=bs', 'bs: hreflang bs-BA points to Bosnian URL');
                        }
                        if (lang === 'el') {
                            addResult((doc.querySelector('#amev-introduction-title')?.textContent || '').includes('AMEV, AMEA και AWEV'), 'el: Greek AMEV intro title is localized');
                            addResult((doc.querySelector('.amev-anchor-link')?.textContent || '').includes('μελλοντικά κουμπιά γλώσσας'), 'el: Greek future-language link is localized');
                        }
                        win.changeLanguage('en');
                        const switchedDoc = iframe.contentDocument;
                        const switchedFaqSchemaRaw = switchedDoc.getElementById('faq-schema-jsonld')?.textContent || '';
                        let switchedFaqSchema = null;
                        try {
                            switchedFaqSchema = switchedFaqSchemaRaw ? JSON.parse(switchedFaqSchemaRaw) : null;
                        } catch (parseError) {
                            addResult(false, `${lang}→en: FAQ JSON-LD parse error (${parseError.message})`);
                        }
                        addResult(switchedDoc.documentElement?.lang === expectedEnState.htmlLang, `${lang}→en: html lang updates on language switch`);
                        addResult(switchedDoc.getElementById('canonical-url')?.getAttribute('href') === expectedEnState.canonical, `${lang}→en: canonical updates on language switch`);
                        addResult(switchedDoc.title === expectedEnState.title, `${lang}→en: document.title updates on language switch`);
                        addResult((switchedDoc.getElementById('meta-description')?.getAttribute('content') || '').includes(expectedEnState.metaDescriptionIncludes), `${lang}→en: meta description updates on language switch`);
                        addResult(switchedDoc.getElementById('meta-og-title')?.getAttribute('content') === expectedEnState.ogTitle, `${lang}→en: og:title updates on language switch`);
                        addResult(switchedDoc.getElementById('meta-og-description')?.getAttribute('content') === expectedEnState.ogDescription, `${lang}→en: og:description updates on language switch`);
                        addResult(switchedDoc.getElementById('meta-og-image-alt')?.getAttribute('content') === expectedEnState.ogImageAlt, `${lang}→en: og:image:alt updates on language switch`);
                        addResult(switchedDoc.getElementById('meta-twitter-title')?.getAttribute('content') === expectedEnState.twitterTitle, `${lang}→en: twitter:title updates on language switch`);
                        addResult(switchedDoc.getElementById('meta-twitter-description')?.getAttribute('content') === expectedEnState.twitterDescription, `${lang}→en: twitter:description updates on language switch`);
                        addResult(switchedDoc.getElementById('meta-twitter-image-alt')?.getAttribute('content') === expectedEnState.twitterImageAlt, `${lang}→en: twitter:image:alt updates on language switch`);
                        addResult((switchedFaqSchema?.mainEntity?.[0]?.name || '') === expectedEnState.faqQuestion1, `${lang}→en: FAQ JSON-LD updates on language switch`);
                    } catch (error) {
                        addResult(false, `${lang}: ${error.message}`);
                    } finally {
                        iframe.remove();
                        resolve();
                    }
                    }).catch((error) => {
                        addResult(false, `${lang}: ${error.message}`);
                        iframe.remove();
                        resolve();
                    });
                };
                document.body.appendChild(iframe);
            });
        }

        (async () => {
            document.body.dataset.testStatus = 'pass';
            for (const scenario of scenarios) {
                await loadScenario(scenario);
            }
        })();
    </script>
</body>
</html>
