<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polynesia WIP Orbital regression checks</title>
</head>
<body>
    <h1>Polynesia WIP Orbital regression checks</h1>
    <pre id="results">Running…</pre>
    <iframe id="app" title="WIP homepage under test" src="./index.html" width="1000" height="700"></iframe>
    <script>
        const results = document.getElementById('results');
        const checks = [];
        const country = 'French Polynesia (France)';
        const path = 'authority/polynesie-francaise-orbital-webapp.html';
        const italian = 'Esplora le Orbital WebApp disponibili: guide informative per Paese, territorio o autorità, con collegamenti alle fonti istituzionali e indicazioni per una verifica preliminare. Il catalogo comprende le pagine attualmente disponibili e potrà essere ampliato.';
        const english = 'Explore the available Orbital WebApps: informational guides by country, territory or authority, with links to institutional sources and guidance for a preliminary check. The catalog includes the pages currently available and may be expanded.';

        function check(condition, message) {
            checks.push(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
            results.textContent = checks.join('\n');
            if (!condition) throw new Error(message);
        }

        async function waitFor(predicate) {
            const deadline = Date.now() + 20000;
            while (!predicate()) {
                if (Date.now() > deadline) throw new Error('Timed out');
                await new Promise(resolve => setTimeout(resolve, 50));
            }
        }

        async function hash(text) {
            return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',
                new TextEncoder().encode(text))))
                .map(byte => byte.toString(16).padStart(2, '0')).join('');
        }

        async function run() {
            const source = await (await fetch('./index.html')).text();
            for (const [pattern, expected] of [
                [/        <nav aria-label="CONSOB · FCA · CNMV · AMF · BaFin · SEC">[\s\S]*?<\/nav>/,
                    '2e40e64972b8624c906578dc05bedb731134a6035c410f8eddfa9fac6f7e9549'],
                [/        <nav id="orbital-micropages"[\s\S]*?<\/nav>/,
                    'c6d6f3478006dfe730b8981a4be0c8cdc445edc926d57eeee6c12e4ffd095337']
            ]) {
                check(await hash(source.match(pattern)?.[0] || '') === expected,
                    'Original Orbital summary block is byte-identical, including links, order and attributes');
            }
            const staticDoc = new DOMParser().parseFromString(source, 'text/html');
            const description = staticDoc.querySelector('[data-i18n-text="orbitalCatalogDescription"]');
            check(description.textContent === italian && description.lang === 'it'
                && description.previousElementSibling.id === 'orbital-micropages'
                && !description.closest('#flags-section, #countries-section, .flags-grid, .countries-grid')
                && !staticDoc.getElementById('orbital-micropages').closest('#flags-section, #countries-section'),
                'Exact static Italian copy is adjacent to the unchanged summary outside grids');
            const database = await (await fetch('./financial_authorities_database.json')).json();
            check(database[country]?.country_name === country,
                'CTA targets the exact database country_name');
            const response = await fetch('./' + path);
            check(response.status === 200, 'Polynesia micropage returns HTTP 200');
            const frame = document.getElementById('app');
            await waitFor(() => frame.contentDocument?.querySelector(`#flagsGrid [aria-label$="${country}"]`));
            const app = frame.contentWindow;
            const doc = frame.contentDocument;
            const dialog = doc.getElementById('consobOrbitalDialog');
            const orbital = doc.getElementById('consobOrbitalFrame');
            check(!app.gridPipelineDiag, 'Focus checks run without opt-in diagnostics');
            for (const locale of ['it', 'en', 'fr']) {
                app.changeLanguage(locale);
                const copy = doc.querySelector('[data-i18n-text="orbitalCatalogDescription"]');
                check(copy.textContent === (locale === 'it' ? italian : english)
                    && copy.lang === (locale === 'it' ? 'it' : 'en'),
                    `${locale}: new catalog text uses existing i18n with explicit English fallback`);
                doc.querySelector(`#flagsGrid [aria-label$="${country}"]`).click();
                const trigger = doc.querySelector('#countryModal .polynesia-orbital-cta');
                check(trigger?.getAttribute('href') === path
                    && trigger.textContent.trim().endsWith(
                        `${locale === 'it' ? 'Apri' : 'Open'} Orbital WebApp · Polynésie française`)
                    && trigger.querySelector('[aria-hidden="true"]')?.textContent === '◎'
                    && trigger.querySelector('[data-i18n-text="polynesiaOrbitalOpen"]').lang === (locale === 'it' ? 'it' : 'en'),
                    `${locale}: flag opens details with localized accessible CTA and decorative icon`);
                for (const options of [{ ctrlKey: true }, { metaKey: true }, { shiftKey: true },
                    { altKey: true }, { button: 1 }]) {
                    const event = new app.MouseEvent('click', { bubbles: true, cancelable: true, ...options });
                    trigger.addEventListener('click', event => {
                        check(!event.defaultPrevented && !dialog.open, 'Modified click retains native link behavior');
                        event.preventDefault();
                    }, { once: true });
                    trigger.dispatchEvent(event);
                }
                app.closeModal();
            }
            app.changeLanguage('it');
            for (const width of [1000, 375]) {
                frame.width = width;
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const flag = doc.querySelector(`#flagsGrid [aria-label$="${country}"]`);
                flag.focus();
                flag.click();
                const trigger = doc.querySelector('#countryModal .polynesia-orbital-cta');
                const box = trigger.getBoundingClientRect();
                check(box.width >= 44 && box.height >= 44
                    && box.left >= 0 && box.right <= app.innerWidth
                    && trigger.scrollWidth <= trigger.clientWidth,
                    `${width}px: touch-sized CTA fits without horizontal overflow`);
                const style = app.getComputedStyle(trigger);
                check(style.color === 'rgb(255, 255, 255)' && style.backgroundColor === 'rgb(30, 58, 138)',
                    'Readable white-on-dark-blue CTA (contrast 10.36:1)');
                trigger.focus();
                check(trigger.matches(':focus-visible') && app.getComputedStyle(trigger).outlineWidth === '3px',
                    'Keyboard focus outline is visible');
                for (const close of ['button', 'iframe Escape', 'dialog cancel']) {
                    // Deliberately leave focus on another control to test the explicit clicked trigger.
                    doc.getElementById('modalCloseButton').focus();
                    trigger.click();
                    await waitFor(() => orbital.contentDocument?.readyState === 'complete'
                        && orbital.contentWindow.location.pathname.endsWith('/' + path));
                    check(dialog.open && dialog.matches(':modal') && dialog.contains(doc.activeElement)
                        && orbital.contentWindow.location.origin === location.origin
                        && orbital.contentDocument.querySelector('h1')?.textContent
                            === 'POLYNÉSIE FRANÇAISE – Autorités financières Orbital WebApp | AMEV'
                        && orbital.contentDocument.body.textContent.includes('IEOM'),
                        `${width}px: shared dialog is modal, focused and actually loads the correct same-origin page`);
                    check(orbital.contentDocument.documentElement.scrollWidth <= orbital.contentWindow.innerWidth,
                        `${width}px: loaded micropage has no horizontal overflow`);
                    if (close === 'button') doc.getElementById('consobOrbitalCloseButton').click();
                    if (close === 'iframe Escape') orbital.contentDocument.dispatchEvent(
                        new orbital.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
                    if (close === 'dialog cancel') dialog.dispatchEvent(new app.Event('cancel', { cancelable: true }));
                    await waitFor(() => !dialog.open && doc.activeElement === trigger);
                    check(orbital.getAttribute('src') === 'about:blank'
                        && doc.getElementById('countryModal').style.display === 'block',
                        `${close}: cleanup and CTA focus return preserve underlying territorial card`);
                }
                app.closeModal();
                check(doc.activeElement === flag, 'Closing territorial card still restores flag focus');
            }
            for (const candidate of [
                'https://example.org/' + path,
                'authority/unlisted.html'
            ]) {
                app.openItalyOrbitalDialog(candidate);
                check(app.resolveConsobOrbitalSrc(candidate) === '' && !dialog.open
                    && orbital.getAttribute('src') === 'about:blank', 'Reject cross-origin or unlisted dialog URL');
            }
            check(app.resolveConsobOrbitalThumbnailSrc(path) === '',
                'Polynesia HTML is not authorized as a thumbnail');
            for (const name of Object.keys(database).filter(name => name !== country)) {
                app.openModal(name);
                check(!doc.querySelector('#countryModal .polynesia-orbital-cta'),
                    `${name}: no unrelated Polynesia CTA`);
                app.closeModal();
            }
            results.dataset.status = 'passed';
        }

        run().catch(error => {
            results.dataset.status = 'failed';
            results.textContent += `\nERROR: ${error.stack || error.message}`;
        });
    </script>
</body>
</html>
