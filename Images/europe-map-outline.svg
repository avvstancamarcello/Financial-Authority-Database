<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" aria-label="Geographic outline of Europe">
  <title>Mappa geografica dell'Europa</title>
  <!-- Ocean/background -->
  <rect width="900" height="800" fill="#dbeafe" opacity="0.3"/>
  <!-- Main European continent outline (simplified) -->
  <path d="
    M 120,560
    L 95,530 L 80,500 L 85,470 L 100,450 L 110,420 L 105,400
    L 120,385 L 130,360 L 125,340 L 110,320 L 115,300
    L 130,285 L 150,275 L 165,260 L 170,240 L 180,220
    L 195,210 L 210,200 L 225,195 L 240,185 L 250,170
    L 260,155 L 280,145 L 300,140 L 320,138 L 340,135
    L 360,130 L 380,125 L 400,122 L 420,118 L 440,115
    L 460,112 L 475,110 L 490,112 L 500,120 L 505,135
    L 498,150 L 490,165 L 495,175 L 510,172 L 525,165
    L 535,155 L 545,150 L 558,152 L 565,162 L 558,178
    L 545,190 L 535,205 L 540,218 L 555,225 L 565,238
    L 558,252 L 540,260 L 525,270 L 515,285 L 520,300
    L 530,315 L 535,330 L 528,345 L 512,355 L 500,368
    L 508,382 L 518,395 L 525,410 L 520,425 L 510,438
    L 518,450 L 535,458 L 552,462 L 565,475 L 568,490
    L 558,505 L 540,512 L 520,505 L 508,490 L 498,480
    L 482,488 L 468,500 L 455,512 L 448,528 L 452,545
    L 462,558 L 458,572 L 445,578 L 430,570 L 420,555
    L 408,548 L 392,555 L 378,562 L 365,555 L 358,540
    L 348,528 L 335,535 L 322,545 L 310,540 L 302,525
    L 295,510 L 282,518 L 268,528 L 255,522 L 248,508
    L 240,495 L 228,500 L 215,510 L 205,502 L 198,485
    L 190,470 L 178,478 L 162,488 L 148,480 L 140,462
    L 132,452 L 120,560 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- Iberian Peninsula (Spain/Portugal) - separate blob -->
  <path d="
    M 105,395
    L 90,380 L 75,365 L 68,348 L 70,330 L 78,315
    L 92,305 L 108,300 L 122,305 L 135,315 L 140,330
    L 138,348 L 130,362 L 120,375 L 112,390 L 105,395 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- Scandinavian Peninsula (Norway/Sweden) -->
  <path d="
    M 390,135
    L 380,118 L 372,100 L 365,82 L 358,65 L 362,52
    L 372,45 L 385,48 L 395,60 L 400,78 L 402,95
    L 405,112 L 408,125 L 398,135 L 390,135 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- Finland/Sweden extension -->
  <path d="
    M 440,115
    L 448,98 L 455,80 L 460,62 L 465,48 L 472,40
    L 482,42 L 490,52 L 492,68 L 488,85 L 480,100
    L 470,112 L 460,120 L 450,118 L 440,115 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- British Isles (Great Britain) -->
  <path d="
    M 195,248
    L 182,232 L 175,215 L 178,198 L 188,188
    L 200,185 L 212,190 L 220,202 L 222,218
    L 218,235 L 208,248 L 198,255 L 195,248 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- Ireland -->
  <path d="
    M 158,272
    L 150,258 L 148,245 L 152,235 L 162,230
    L 172,232 L 178,242 L 176,255 L 168,268
    L 160,275 L 158,272 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- Italian Peninsula -->
  <path d="
    M 302,435
    L 295,450 L 290,468 L 292,485 L 298,500
    L 305,515 L 310,528 L 308,540 L 298,542
    L 290,532 L 285,515 L 283,498 L 285,480
    L 290,462 L 295,445 L 300,432 L 302,435 Z
  " fill="#c5dcf2" stroke="#7fb3d3" stroke-width="2" opacity="0.8"/>
  <!-- Sicily -->
  <ellipse cx="310" cy="555" rx="18" ry="12" fill="#c5dcf2" stroke="#7fb3d3" stroke-width="1.5" opacity="0.8"/>
  <!-- Corsica/Sardinia -->
  <ellipse cx="278" cy="498" rx="10" ry="16" fill="#c5dcf2" stroke="#7fb3d3" stroke-width="1.5" opacity="0.8"/>
  <!-- Crete -->
  <ellipse cx="450" cy="568" rx="20" ry="9" fill="#c5dcf2" stroke="#7fb3d3" stroke-width="1.5" opacity="0.8"/>
  <!-- Grid lines (latitude/longitude style) -->
  <g stroke="#93c5fd" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="450" y1="0" x2="450" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
  </g>
</svg>
